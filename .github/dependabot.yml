# SHA-gepinnte Actions veralten still — ein Commit-SHA sagt nicht, dass eine neuere
# Version existiert. Dependabot liest den Versions-Kommentar hinter dem Pin und öffnet
# einen PR mit dem SHA der neuen Version. Ohne diese Datei wäre das SHA-Pinning ein
# Sicherheitsgewinn, den man mit Wartungsblindheit bezahlt.
#
# Sicherheits-Updates für Abhängigkeiten laufen getrennt davon über den Repo-Schalter
# (Dependabot security updates) und brauchen keine Konfiguration.
#
# Gemergt wird von Hand: Auto-Merge ist seit 2026-09-23 repo-weit aus, nachdem er in einem
# Nachbar-Repo zwei Dependabot-PRs nach einem Rebase selbst durchgewinkt hat — den rebasten
# Stand hatte niemand gesehen. Gegenleistung für die Handarbeit sind die Gruppen unten.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      # Patch und Minor zusammen in EINEN PR. Majors bleiben absichtlich draußen und kommen
      # einzeln: ein Major kann die Laufzeit wechseln (node20 → node24) oder Eingaben
      # entfernen, das gehört einzeln angesehen. Ein Patch-Bump mit gepinntem SHA und
      # grüner Suite gehört es nicht.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Die Abhängigkeiten selbst. Bis 2026-09-22 fehlten sie hier: Dependabot meldete zwar
  # Sicherheitslücken (das tut es repo-weit), aber es gab keine regulären Versions-PRs.
  # ⚠️ Grenze, gemessen an TinySesam: bei einem Projekt mit `>=`-Untergrenzen hebt die
  # Vorgabe-Strategie (widen) die Untergrenze NIE an — reguläre pip-PRs bleiben aus,
  # obwohl die Untergrenze verwundbar sein kann. Dagegen hilft nur ein Lauf gegen die
  # niedrigste auflösbare Version, nicht diese Datei.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # TinySesam hebt der uv-Eintrag darunter an (dort steht der Pin mit Prüfsumme). Zöge
    # auch dieser Eintrag, gäbe es zwei PRs für einen Sprung, und jeder allein wäre rot.
    # Die pyproject-Zeile wird im uv-PR von Hand nachgezogen — test_repo.py sagt es.
    ignore:
      - dependency-name: tinysesam
    groups:
      # Bis 2026-09-23 bündelte hier eine Gruppe `alle` ohne Filter jeden Bump in einen PR —
      # also auch Majors. Jetzt trennt der update-types-Filter: Patch und Minor zusammen in
      # EINEN PR, Majors einzeln, weil ein Major Verhalten ändern oder Eingaben entfernen
      # kann. Zwei Gruppen mit `patterns: ["*"]` dürfen hier nicht stehen, Dependabot
      # verlangt eindeutige, nicht überlappende Gruppen.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Was das Abbild wirklich installiert: app/requirements.txt, per `uv pip compile
  # --generate-hashes` aus app/requirements.in erzeugt. Das uv-Ökosystem erkennt die Datei am
  # Kopf, hebt den Pin in der .in an und erzeugt die .txt mit denselben Optionen neu —
  # Prüfsummen eingeschlossen (dependabot-core: uv/lib/.../compile_file_updater.rb).
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: monthly
    groups:
      # Wie oben: Patch und Minor gebündelt, Majors einzeln.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
  # Das Basis-Abbild ist per Digest gepinnt; ohne Dependabot bliebe es für immer stehen.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      # Patch und Minor zusammen, Majors einzeln — ein Major des Basis-Abbilds wechselt die
      # Distribution oder die Python-Version und gehört einzeln angesehen.
      klein:
        patterns: ["*"]
        update-types: ["patch", "minor"]
