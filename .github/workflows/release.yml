name: Release

# Ein Tag löst aus. Die Reihenfolge ist Absicht: erst prüfen, dann testen, dann bauen,
# dann veröffentlichen. Ein Release mit falscher Nummer ist schlimmer als keins —
# es ist unauffällig falsch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false`: eigene Härtung, kein belegter Standard. Nach dem
      # Checkout laufen hier `pip install -e` und mehrere Dritt-Actions — das Token
      # gehört ihnen nicht in die Hand. Veröffentlicht wird über `gh release create`
      # und `docker push` mit GITHUB_TOKEN, nicht über die git-Credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # `workflow_dispatch` ist der TROCKENLAUF und seit 2026-09-24 auch einer: bis dahin gab es
      # den Knopf, aber jeder Druck darauf wäre hier gescheitert (`GITHUB_REF_NAME` ist dann ein
      # Branch) — und wäre er es nicht, hätte der Lauf aus einem Branch heraus ein Abbild nach
      # ghcr GESCHOBEN und ein Release angelegt. Ein Notausgang, der klemmt oder ins Freie führt,
      # ist keiner. Warum der Trockenlauf überhaupt zählt: ein Workflow mit `on: push: tags` wird
      # von der normalen CI nie berührt (Register 2026-09-23).
      - name: Tag gegen die Paketversion prüfen
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Tag $TAG, pyproject $PKG"
          [ "$TAG" = "$PKG" ] || { echo "Tag und Paketversion laufen auseinander"; exit 1; }
          grep -q "## \[$PKG\]" CHANGELOG.md || { echo "CHANGELOG kennt $PKG nicht"; exit 1; }

      # Ohne Tag ist der Vergleich unmöglich — geprüft wird, was prüfbar ist: dass die
      # Paketversion im CHANGELOG steht. Der Schritt ist also nicht bloß übersprungen.
      - name: Trockenlauf — Version und CHANGELOG
        if: github.ref_type != 'tag'
        run: |
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "Trockenlauf ohne Tag. Paketversion: $PKG"
          grep -q "## \[$PKG\]" CHANGELOG.md || { echo "CHANGELOG kennt $PKG nicht"; exit 1; }
          echo "CHANGELOG kennt $PKG — bereit für den Tag v$PKG"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0

      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        run: |
          pip install -e ".[dev]"
          ./scripts/check.sh

      - name: Registry-Namen kleinschreiben
        # github.repository_owner liefert die Schreibweise des Kontos; buildx verlangt
        # Kleinbuchstaben und bricht sonst ab — bei grünem Job und fehlendem Abbild.
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Ein SHA-Pin auf die Action deckt NICHT, was sie zur Laufzeit nachlaedt.

      # setup-qemu-action zieht per Vorgabe `tonistiigi/binfmt:latest` und fuehrt es

      # `--privileged` aus — in genau dem Job, der Abbilder baut und veroeffentlicht.

      # Deshalb per DIGEST gepinnt (entspricht dem Tag qemu-v10.2.3, 2026-06-08).

      # ⚠️ Dependabot fasst Action-EINGABEN nicht an: dieser Pin veraltet still und

      # muss von Hand gehoben werden.

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

        with:

          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      # Ohne `version` holt die Action die jeweils neueste buildx-Fassung — derselbe
      # ungepinnte Eingang wie oben, nur leiser. v0.37.1 ist die neueste stable
      # (2026-09-11). Auch dieser Pin altert ohne Dependabot.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1

      # Anmelden nur, wenn auch geschoben wird — ein Trockenlauf braucht keine Registry-Sitzung.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Der Bau läuft IMMER — er ist der Teil, der bisher nur beim Tag lief und beim ersten Tag
      # nach zwei Monaten rot war (TinySesam, fehlende Bau-Abhängigkeiten). Geschoben wird nur
      # beim Tag: `push: ${{ github.ref_type == 'tag' }}`.
      - name: Abbild bauen und veröffentlichen (genau ein Tag, kein latest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/${{ env.OWNER_LC }}/dashmyboard:${{ github.ref_name }}

      - name: Digest ins Log — wer es ernst meint, pinnt ihn
        run: echo "ghcr.io/${{ env.OWNER_LC }}/dashmyboard@${{ steps.build.outputs.digest }}"

      - name: Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Abbild: \`ghcr.io/${OWNER_LC}/dashmyboard:${GITHUB_REF_NAME}\`

          Digest: \`${{ steps.build.outputs.digest }}\`

          Änderungen: siehe [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
