[project]
name = "dashmyboard"
version = "0.5.6"
description = "Self-hosted dashboard behind single sign-on: link tree, bookmarks, embedded pages — editable in place."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["dashboard", "homepage", "startpage", "oidc", "sso", "fastapi", "self-hosted"]

dependencies = [
    # TinySesam verlangt seit 0.19.0 fastapi>=0.133.0 (erste Fassung mit starlette>=1.3.1).
    "fastapi>=0.133.0",
    # Boden 3.1.6: Jede ältere 3.1.x trägt bekannte Lücken (`xmlattr`-XSS, Sandbox-Ausbrüche);
    # das Schwachstellen-Tor (`audit.yml`, Auflösung `boden`) prüft genau diese Untergrenze.
    "jinja2>=3.1.6",
    # Plain uvicorn plus the two speedups it picks up by itself (`--loop auto`, `--http auto`). Until 0.5.5 this was
    # `uvicorn[standard]`, which also pulls pyyaml, watchfiles, websockets and python-dotenv — none of them used here,
    # and pyyaml 6.0.3 has no wheel for CPython 3.15 (the image build would have to compile it).
    "uvicorn>=0.32",
    "httptools>=0.9.0",
    "uvloop>=0.23.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    # Von PyPI, exakt gepinnt — dieselbe Version wie app/requirements.in, wo das Abbild
    # sie mit Prüfsumme bezieht. Kein Git-Tag mehr: der ist umhängbar.
    "tinysesam[oidc]==0.24.13",
    # Boden 1.9.1: authlib 1.8.x trägt bekannte Lücken; tinysesam verlangt nur >=1.6.12.
    "authlib>=1.9.1",
    # Boden 1.7.6: joserfc 1.7.5 trägt CVE-2026-119284 (über tinysesam/authlib).
    "joserfc>=1.7.6",
]

[project.optional-dependencies]
# Nur für die Testsuite: der Browser-Test spricht das DevTools-Protokoll.
dev = ["websockets>=12", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Ollornog/DashMyBoard"
Issues = "https://github.com/Ollornog/DashMyBoard/issues"

[tool.setuptools]
packages = []
